<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>博客管理后台</title>
	<!-- 全部 defer：Decap 需要在 DOM 就绪后初始化（body 未创建时挂载会报 null）；
	     defer 脚本按文档顺序执行：React → CMS → 配置 → widget -->
	<script defer src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js"></script>
	<!-- 本地脚本带版本号：修改后递增 v 值，强制浏览器拉新（EdgeOne 有缓存） -->
	<script defer src="/admin/admin-config.js?v=2"></script>
	<script defer src="/admin/widgets/imgbed-widget.js?v=2"></script>
	<script defer src="/admin/widgets/amap-widget.js?v=2"></script>
</head>
<body>
	<!-- Decap CMS 自动渲染后台界面（认证走 OAuth 弹窗 postMessage，无需 hash token 处理） -->
</body>
</html>
