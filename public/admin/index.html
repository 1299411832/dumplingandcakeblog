<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>博客管理后台</title>
	<!-- Sveltia CMS（Decap 兼容的后台，自动读取同目录 config.yml） -->
	<script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.181.1/dist/sveltia-cms.js"></script>
	<!-- 自定义 widget 需要 React（与 CMS 内部版本一致的 UMD） -->
	<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
	<!-- 自定义 widget 必须在 CMS 加载之后注册 -->
	<script src="/admin/admin-config.js"></script>
	<script src="/admin/widgets/imgbed-widget.js"></script>
	<script src="/admin/widgets/amap-widget.js"></script>
</head>
<body>
	<!-- Sveltia CMS 会自动渲染后台界面 -->
	<script>
		// 登录后的跳转目标（OAuth 回调会回到这里）
		if (window.location.hash && window.location.hash.indexOf("access_token=") > -1) {
			localStorage.setItem("sveltia-cms:token", window.location.hash.split("access_token=")[1]);
			window.location.hash = "";
		}
	</script>
</body>
</html>
