# Decap CMS 配置
# 管理后台：https://blog.tsh520.cn/admin/
# 说明：Decap 的 nested collections 是 beta（有已知 bug，如 #6974/#7527/#7359），
#       故 posts 按分类拆成多个普通集合（官方文档认可的标准做法，稳定可靠）
# 字段与 src/content.config.ts 的 zod schema 对齐（保存后构建必须通过）

backend:
  name: github
  repo: tianshihao2003/dumplingandcakeblog
  branch: main
  # 自建 OAuth 服务器（EdgeOne cloud-functions）：
  # popup 打开 /oauth → GitHub 授权 → 回调 /oauth/callback 换 token
  # GitHub OAuth App 的 Authorization callback URL 配置为：
  #   https://blog.tsh520.cn/oauth/callback
  base_url: https://blog.tsh520.cn
  auth_endpoint: oauth

# 备用媒体库：上传到仓库 public/assets（主要用图床直传 widget）
media_folder: "public/assets"
public_folder: "/assets"

# posts 字段模板（各分类集合共用，YAML anchor）
x-posts-fields: &posts-fields
  - { label: 标题, name: title, widget: string, required: true }
  - label: 发布时间
    name: published
    widget: datetime
    required: true
    format: "yyyy-MM-dd"
    date_format: "yyyy-MM-dd"
    time_format: false
  - { label: 更新时间, name: updated, widget: datetime, required: false, format: "yyyy-MM-dd", date_format: "yyyy-MM-dd", time_format: false }
  - { label: 草稿, name: draft, widget: boolean, default: false }
  - { label: 摘要, name: description, widget: text }
  - { label: 封面图, name: image, widget: image, required: false }
  - label: 标签
    name: tags
    widget: list
    field: { label: 标签, name: tag, widget: string }
  - { label: 分类, name: category, widget: string, required: false }
  - label: 语言
    name: lang
    widget: select
    options:
      - { label: 中文, value: "" }
      - { label: English, value: en }
      - { label: 日本語, value: ja }
      - { label: 繁體中文, value: zh_TW }
      - { label: Русский, value: ru }
  - { label: 置顶, name: pinned, widget: boolean, default: false }
  - { label: 作者, name: author, widget: string, required: false }
  - { label: 原文链接, name: sourceLink, widget: string, required: false }
  - { label: 许可名称, name: licenseName, widget: string, required: false }
  - { label: 许可链接, name: licenseUrl, widget: string, required: false }
  - { label: 启用评论, name: comment, widget: boolean, default: true }
  - { label: 排序权重, name: order, widget: number, required: false }
  - label: 摘要来源
    name: descriptionSource
    widget: select
    required: false
    options: [manual, ai]
  - { label: 正文, name: body, widget: markdown }

# notebooks 字段模板
x-notebook-fields: &notebook-fields
  - { label: 标题, name: name, widget: string }
  - { label: 日期, name: date, widget: datetime, format: "yyyy-MM-dd", date_format: "yyyy-MM-dd", time_format: false, type: date }
  - { label: 内容, name: body, widget: text }

