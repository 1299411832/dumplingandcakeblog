  # ============================================================
  # 💬 动态
  # ============================================================
  - name: moments
    label: 💬 动态
    label_singular: 动态
    folder: src/content/moments
    create: true
    delete: true
    extension: md
    format: frontmatter
    # 文件名即日期（同日第二篇需手动在 GitHub 改名）
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - label: 时间
        name: published
        widget: datetime
        required: true
        format: "yyyy-MM-dd HH:mm:ss"
        date_format: "yyyy-MM-dd"
        time_format: "HH:mm:ss"
      - { label: 作者, name: author, widget: string, required: false }
      - { label: 头像, name: avatar, widget: string, required: false }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - label: 图片
        name: images
        widget: list
        field: { label: 图片 URL, name: url, widget: imgbed }
      - { label: 位置, name: location, widget: string, required: false }
      - { label: 设备, name: device, widget: string, required: false }
      - { label: 置顶, name: pinned, widget: boolean, default: false }
      - { label: 内容, name: body, widget: text }

  # ============================================================
  # 🔗 友链与应用
  # ============================================================
  - name: friends
    label: 🔗 友情链接
    label_singular: 友链
    folder: src/content/friends
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    fields:
      - { label: 站点名, name: title, widget: string, required: true }
      - { label: 头像链接, name: imgurl, widget: string, required: true }
      - { label: 站点描述, name: desc, widget: string, required: true }
      - { label: 站点链接, name: siteurl, widget: string, required: true }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 权重, name: weight, widget: number, default: 0 }
      - { label: 启用, name: enabled, widget: boolean, default: true }

  - name: apps
    label: 📱 应用
    label_singular: 应用
    folder: src/content/apps
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    fields:
      - { label: 应用名, name: title, widget: string, required: true }
      - { label: 图标链接, name: imgurl, widget: string, required: true }
      - { label: 应用描述, name: desc, widget: string, required: true }
      - { label: 应用链接, name: siteurl, widget: string, required: true }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 权重, name: weight, widget: number, default: 0 }
      - { label: 启用, name: enabled, widget: boolean, default: true }

  # ============================================================
  # 📍 足迹
  # ============================================================
  - name: life-places
    label: 📍 足迹
    label_singular: 足迹
    folder: src/content/life/places
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: 日期, name: date, widget: datetime, format: "yyyy-MM-dd", date_format: "yyyy-MM-dd", time_format: false, type: date }
      - { label: ID, name: id, widget: string, required: false }
      - { label: 省份, name: province, widget: string, required: false }
      - { label: 城市, name: city, widget: string, required: false }
      - { label: 体验, name: experience, widget: text, required: false }
      - { label: 访问次数, name: visitCount, widget: number, default: 1 }
      - { label: 纬度, name: lat, widget: number, required: false }
      - { label: 经度, name: lng, widget: number, required: false }
      # 高德坐标搜索辅助字段：搜索后自动回填 lat/lng（保存时由 preSave 钩子展开）
      - label: 坐标搜索
        name: amap-coords
        widget: amap-geocode
        required: false
        fields:
          - { label: 纬度, name: lat, widget: number }
          - { label: 经度, name: lng, widget: number }
      - { label: 关联链接, name: url, widget: string, required: false }
      - { label: 链接文字, name: urlLabel, widget: string, required: false }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - label: 照片
        name: photos
        widget: list
        field: { label: 照片 URL, name: url, widget: imgbed }
      - { label: 备注, name: body, widget: text }

  # ============================================================
  # 📝 笔记本（仅收录根目录有条目的笔记本；深层笔记本用 Obsidian 维护）
