      - { label: 日期, name: date, widget: datetime, required: true, format: "yyyy-MM-dd", date_format: "yyyy-MM-dd", time_format: false, type: date }
      - { label: 地点, name: location, widget: string, required: false }
      - label: 标签
        name: tags
