        field: { label: 标签, name: tag, widget: string }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 图床文件夹, name: imgbedFolder, widget: string, required: false }
      - label: 照片列表
        name: photos
        widget: list
        field: { label: 照片 URL, name: url, widget: imgbed }
      - { label: 描述, name: body, widget: text }

  # ============================================================
  # 🧭 导航链接
  # ============================================================
  - name: daohang
    label: 🧭 导航链接
    label_singular: 导航
    folder: src/content/daohang
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{name}}"
    fields:
      - { label: 名称, name: name, widget: string, required: true }
      - { label: 链接, name: url, widget: string, required: true }
      - { label: 图标链接, name: icon, widget: string, required: false }
      - { label: 描述, name: description, widget: string, required: false }
      - { label: 分类, name: category, widget: string, default: 未分类 }
      - label: 标签
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 颜色, name: color, widget: string, required: false }
      - { label: 图片, name: image, widget: string, required: false }
      - { label: 推荐, name: featured, widget: boolean, default: false }
      - { label: 排序, name: order, widget: number, default: 0 }
      - { label: 备注, name: body, widget: text }

  # ============================================================
  # 📢 公告/每日一言（ziyuan 集合：公告与语录两种形态共用，二选一填写）
  # ============================================================
  - name: ziyuan
    label: 📢 公告/每日一言
    label_singular: 条目
    folder: src/content/ziyuan
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    fields:
      - { label: 标题, name: title, widget: string, required: true }
      - label: 内容（公告形态）
        name: content
        widget: text
        required: false
        hint: 公告内容；与"每日一言"二选一填写
      - { label: 可关闭, name: closable, widget: boolean, default: true }
      - label: 链接（公告形态）
        name: link
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 启用, name: enable, widget: boolean, default: true }
          - { label: 按钮文字, name: text, widget: string }
          - { label: 链接地址, name: url, widget: string }
          - { label: 新窗口打开, name: external, widget: boolean, default: false }
      - label: 每日一言（语录形态）
        name: quotes
        widget: list
        required: false
        hint: 语录列表；与"公告"二选一填写
        fields:
          - { label: 内容, name: text, widget: text, required: true }
          - { label: 作者, name: author, widget: string, required: true }
