  # ============================================================
  # 🖼️ 相册
  # ============================================================
  - name: album
    label: 🖼️ 相册
    label_singular: 相册
    folder: src/content/album
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    fields:
